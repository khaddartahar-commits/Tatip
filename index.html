<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ltprysm Web Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
    header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 2px solid #e50914; }
    header h1 { color: #e50914; font-size: 22px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 10px; }
    .player-box {
      background: #000; border-radius: 12px; overflow: hidden; margin: 15px 0;
      box-shadow: 0 0 20px rgba(229,9,20,0.3); position: sticky; top: 0; z-index: 999;
    }
    video { width: 100%; height: 230px; background: #000; display: block; }
    .controls { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #1a1a1a; border-radius: 10px; margin-bottom: 15px; }
    .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
    .tab { flex: 1; padding: 10px; background: #2a2a2a; border: none; color: #fff; border-radius: 8px; cursor: pointer; }
    .tab.active { background: #e50914; font-weight: bold; }
    .input-group { display: none; flex-direction: column; gap: 10px; }
    .input-group.active { display: flex; }
    input { padding: 12px; border: none; border-radius: 8px; background: #2a2a2a; color: #fff; font-size: 14px; }
    input::placeholder { color: #888; }
    button { padding: 12px; border: none; border-radius: 8px; background: #e50914; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #b20710; }
    #playlist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 0 80px 0; }
    .channel { background: #1a1a1a; padding: 15px 8px; border-radius: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; font-size: 13px; min-height: 60px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .channel:hover { background: #2a2a2a; border-color: #e50914; transform: scale(1.02); }
    .channel.active { background: #e50914; font-weight: bold; border-color: #fff; }
    .error { color: #ff5555; text-align: center; padding: 10px; font-size: 12px; }
    @media (min-width: 768px) { #playlist { grid-template-columns: repeat(4, 1fr); } video { height: 450px; } }
  </style>
</head>
<body>
  <header><h1>Ltprysm Web Player 📺</h1></header>
  <div class="container">
    
    <div class="controls">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('m3u')">رابط M3U</button>
        <button class="tab" onclick="switchTab('xtream')">Xtream API</button>
      </div>

      <!-- تبويب M3U -->
      <div id="m3uTab" class="input-group active">
        <input id="customUrl" type="text" placeholder="الصق هنا رابط m3u">
        <button onclick="loadM3U()">تحميل M3U</button>
      </div>

      <!-- تبويب Xtream -->
      <div id="xtreamTab" class="input-group">
        <input id="xtreamUrl" type="text" placeholder="رابط السيرفر: http://vpnca.ipnowstore.com:80">
        <input id="xtreamUser" type="text" placeholder="اسم المستخدم: Po2PUHp5in">
        <input id="xtreamPass" type="password" placeholder="كلمة السر: sD5akh8heg">
        <button onclick="loadXtream()">تحميل Xtream</button>
      </div>
    </div>

    <div class="player-box">
      <video id="video" controls autoplay playsinline></video>
      <div id="errorMsg" class="error"></div>
    </div>

    <div id="playlist"></div>
  </div>

<script>
let hls, activeBtn = null, baseXtreamUrl = "";

// التبديل بين التبويبات
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.input-group').forEach(g => g.classList.remove('active'));
  if(tab === 'm3u'){
    document.querySelector('.tab:nth-child(1)').classList.add('active');
    document.getElementById('m3uTab').classList.add('active');
  } else {
    document.querySelector('.tab:nth-child(2)').classList.add('active');
    document.getElementById('xtreamTab').classList.add('active');
  }
}

// تحميل M3U عادي
async function loadM3U() {
  const url = document.getElementById('customUrl').value;
  if(!url) return alert("الصق الرابط");
  await parseM3U(url);
}

// تحميل Xtream API
async function loadXtream() {
  const url = document.getElementById('xtreamUrl').value.replace(/\/$/, '');
  const user = document.getElementById('xtreamUser').value;
  const pass = document.getElementById('xtreamPass').value;
  if(!url || !user || !pass) return alert("املأ كل الخانات");
  
  baseXtreamUrl = url;
  document.getElementById('errorMsg').innerText = "جاري جلب القنوات...";
  
  // نجيب قنوات البث المباشر
  const api = `${url}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
  const res = await fetch(api);
  const data = await res.json();
  
  const playlistDiv = document.getElementById('playlist');
  playlistDiv.innerHTML = '';
  
  data.forEach(ch => {
    const btn = document.createElement('div');
    btn.className = 'channel';
    btn.innerText = ch.name;
    const streamUrl = `${url}/live/${user}/${pass}/${ch.stream_id}.m3u8`;
    btn.onclick = () => {
      playChannel(streamUrl);
      if(activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active'); activeBtn = btn;
    };
    playlistDiv.appendChild(btn);
  });
  document.getElementById('errorMsg').innerText = "تم تحميل " + data.length + " قناة";
}

// دالة تشغيل
function playChannel(url){
  const video = document.getElementById('video'); 
  document.getElementById('errorMsg').innerText = "جاري التشغيل...";
  if(hls) hls.destroy(); 
  if(Hls.isSupported()){ 
    hls = new Hls(); 
    hls.loadSource(url); 
    hls.attachMedia(video); 
  } else { 
    video.src = url; 
  }
  video.play().catch(e => { document.getElementById('errorMsg').innerText = "اضغط تشغيل يدوي"; });
}

// دالة تحليل M3U
async function parseM3U(url){
  const res = await fetch(url); const text = await res.text(); const lines = text.split('\n');
  const playlistDiv = document.getElementById('playlist'); playlistDiv.innerHTML = '';
  for(let i=0; i<lines.length; i++){
    if(lines[i].startsWith('#EXTINF')){
      const name = lines[i].split(',')[1] || "قناة"; const link = lines[i+1];
      if(link && link.startsWith('http')){
        const btn = document.createElement('div'); btn.className = 'channel'; btn.innerText = name;
        btn.onclick = () => { playChannel(link); if(activeBtn) activeBtn.classList.remove('active'); btn.classList.add('active'); activeBtn = btn; };
        playlistDiv.appendChild(btn);
      }
    }
  }
}
</script>
</body>
</html>
