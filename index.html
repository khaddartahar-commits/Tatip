<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ltprysm Web Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    header { 
      background: #1a1a1a; 
      padding: 15px; 
      text-align: center; 
      border-bottom: 2px solid #e50914; 
    }
    header h1 { color: #e50914; font-size: 22px; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 10px; }
    
    /* تثبيت الفيديو */
    .player-box {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin: 15px 0;
      box-shadow: 0 0 20px rgba(229,9,20,0.3);
      position: sticky;
      top: 0;
      z-index: 10;
      padding-top: 10px;
    }
    video { width: 100%; height: 220px; background: #000; display: block; }
    
    .controls { display: flex; gap: 10px; padding: 10px; background: #1a1a1a; border-radius: 10px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #2a2a2a; color: #fff; font-size: 14px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: #e50914; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #b20710; }
    
    #playlist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 0 80px 0; }
    .channel { background: #1a1a1a; padding: 20px 10px; border-radius: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; font-size: 14px; min-height: 70px; display: flex; align-items: center; justify-content: center; }
    .channel:hover { background: #2a2a2a; border-color: #e50914; }
    .channel.active { background: #e50914; font-weight: bold; }
    .error { color: #ff5555; text-align: center; padding: 10px; }
    
    @media (min-width: 768px) { #playlist { grid-template-columns: repeat(4, 1fr); } video { height: 400px; } }
  </style>
</head>
<body>
  <header>
    <h1>📺 Ltprysm Web Player</h1>
  </header>

  <div class="container">
    <div class="controls">
      <input id="m3uUrl" type="text" value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8">
      <button onclick="loadM3U()">تحميل</button>
    </div>

    <div class="player-box">
      <video id="video" controls autoplay playsinline></video>
      <div id="errorMsg" class="error"></div>
    </div>

    <div id="playlist"></div>
  </div>

<script>
let hls, activeBtn = null;

async function loadM3U() {
  document.getElementById('errorMsg').innerText = "جاري التحميل...";
  const url = document.getElementById('m3uUrl').value;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const lines = text.split('\n');
    const playlistDiv = document.getElementById('playlist');
    playlistDiv.innerHTML = '';
    
    for(let i=0; i<lines.length; i++){
      if(lines[i].startsWith('#EXTINF')){
        const name = lines[i].split(',')[1] || "قناة";
        const link = lines[i+1];
        if(link && link.startsWith('http')){
          const btn = document.createElement('div');
          btn.className = 'channel';
          btn.innerText = name;
          btn.onclick = () => {
            playChannel(link);
            if(activeBtn) activeBtn.classList.remove('active');
            btn.classList.add('active');
            activeBtn = btn;
          };
          playlistDiv.appendChild(btn);
        }
      }
    }
    document.getElementById('errorMsg').innerText = "";
  } catch(e) {
    document.getElementById('errorMsg').innerText = "فشل تحميل القائمة";
  }
}

function playChannel(url){
  const video = document.getElementById('video');
  if(hls) hls.destroy();
  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }
  video.play().catch(e => {});
}

window.onload = loadM3U;
</script>
</body>
</html>
